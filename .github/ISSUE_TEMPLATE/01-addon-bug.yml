name: Addon bug or wrong rotation advice
description: NAG is in-game but something is broken, missing, or suggesting the wrong ability.
labels: ["bug", "Core Addon"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The three dropdowns below are the difference between
        a fix today and a week of back-and-forth — please fill them in even if the
        problem seems obvious.
  - type: dropdown
    id: expansion
    attributes:
      label: Expansion
      description: Which version of the game were you playing?
      options:
        - Classic Era (Vanilla)
        - Season of Discovery
        - The Burning Crusade
        - Wrath of the Lich King
        - Cataclysm
        - Mists of Pandaria
        - Titan
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Class
      options:
        - Death Knight
        - Druid
        - Hunter
        - Mage
        - Monk
        - Paladin
        - Priest
        - Rogue
        - Shaman
        - Warlock
        - Warrior
        - Not class-specific
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec and talents
      description: Spec name is enough. A talent link is better if you have one.
      placeholder: "Feral, or: Fury 2/0/49"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: NAG addon version
      description: Shown at the top of the NAG options window, or in the addon list on the character screen.
      placeholder: "5.6.32"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did NAG do or show?
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What you expected instead
      description: If this is about rotation advice, say which ability you think should have come up and why.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Where you were, what you were fighting, and whether it happens every time or now and then.
      placeholder: |
        1. Target dummy in Orgrimmar
        2. Open with ...
        3. NAG shows ... from the third global onwards
    validations:
      required: false
  - type: textarea
    id: errors
    attributes:
      label: Any error text
      description: Paste Lua errors here if you have them. This box formats as code automatically.
      render: text
    validations:
      required: false
