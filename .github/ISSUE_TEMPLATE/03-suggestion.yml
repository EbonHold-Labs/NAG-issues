name: Suggestion or feature request
description: An idea for something NAG should do, or do differently.
labels: ["Suggestion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like NAG to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What problem would that solve for you?
      description: The situation it comes up in matters more than the implementation — tell us what you are trying to get done.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of NAG
      options:
        - Rotation advice
        - The in-game display
        - Helper app
        - Log analysis
        - Discord bot
        - Website or store
        - Something else
    validations:
      required: false
  - type: dropdown
    id: expansion
    attributes:
      label: Expansion this applies to
      options:
        - All of them
        - Classic Era (Vanilla)
        - Season of Discovery
        - The Burning Crusade
        - Wrath of the Lich King
        - Cataclysm
        - Mists of Pandaria
        - Titan
    validations:
      required: false
